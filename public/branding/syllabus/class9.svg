        <text x="28" y="25" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FACC15">Chemistry (12 MCQs)</text>
        <text x="28" y="44" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">Matter in Our Surroundings, Is Matter Pure?, Atoms &amp; Molecules, Structure of Atom</text>
      </g>
    
      <g transform="translate(40, 386)">
        <rect width="1120" height="58" rx="14" fill="#0E1B3E" stroke="#1E3264" stroke-width="1.5" />
        <rect x="0" y="0" width="8" height="58" rx="4" fill="#0066FF" />
        <text x="28" y="25" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FACC15">Biology (12 MCQs)</text>
        <text x="28" y="44" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">Fundamental Unit of Life (Cell), Tissues, Diversity, Natural Resources</text>
      </g>
    
      <g transform="translate(40, 454)">
        <rect width="1120" height="58" rx="14" fill="#0E1B3E" stroke="#1E3264" stroke-width="1.5" />
        <rect x="0" y="0" width="8" height="58" rx="4" fill="#0066FF" />
        <text x="28" y="25" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FACC15">Mathematics (14 MCQs)</text>
        <text x="28" y="44" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">Number Systems, Polynomials, Coordinate Geometry, Lines &amp; Angles, Triangles, Circles</text>
      </g>
    
      <g transform="translate(40, 522)">
        <rect width="1120" height="58" rx="14" fill="#0E1B3E" stroke="#1E3264" stroke-width="1.5" />
        <rect x="0" y="0" width="8" height="58" rx="4" fill="#0066FF" />
        <text x="28" y="25" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FACC15">Mental Ability (10 MCQs)</text>
        <text x="28" y="44" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">Analytical Reasoning, Data Sufficiency, Ranking &amp; Sequencing, Logical Clocks</text>
      </g>
    

  <!-- Footer Banner with ISRO & Scholarship Guarantee -->
  <g transform="translate(40, 715)">
    <rect width="1120" height="54" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="33" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#FBBF24">★ WIN UP TO 90% SCHOLARSHIP &amp; NATIONAL ISRO STUDY TOUR</text>
