    <text x="0" y="80" font-family="Segoe UI, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">CLASS 9 — SYLLABUS &amp; PATTERN</text>
    <text x="0" y="112" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#94A3B8">Pre-JEE &amp; Pre-NEET Advanced Foundation • Target: NSEJS Olympiad, State Board &amp; CBSE/ICSE High Achievers</text>
  </g>

  <!-- Key Exam Metrics Banner -->
